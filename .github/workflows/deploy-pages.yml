name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Restore the last headline snapshot
        uses: actions/cache/restore@v5
        with:
          path: public/home/feeds.json
          key: home-feeds-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: home-feeds-v1-

      - name: Update headlines
        run: python3 scripts/update-home-feeds.py
        continue-on-error: true

      - name: Cache usable headlines
        if: ${{ hashFiles('public/home/feeds.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: public/home/feeds.json
          key: home-feeds-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build
        env:
          VITE_GIT_COMMIT: ${{ github.sha }}
          VITE_STATUS_URL: ${{ vars.VITE_STATUS_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
