<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Alex Sue — Personal Status Dashboard</title>
    <meta
      name="description"
      content="Alex Sue's personal status dashboard, projects, and links."
    />
    <link rel="canonical" href="https://alexsue.com/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f7f5" />

    <script>
      // Stamp an explicit theme choice before first paint. A visitor who left
      // the choice to their system stamps nothing and falls through to the
      // prefers-color-scheme rules in the stylesheet.
      try {
        var theme = localStorage.getItem('alexsue-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme)
        }
      } catch (e) { /* Storage may be disabled. */ }
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alexsue.com/" />
    <meta property="og:title" content="Alex Sue — Personal Status Dashboard" />
    <meta
      property="og:description"
      content="Alex Sue's personal status dashboard, projects, and links."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
